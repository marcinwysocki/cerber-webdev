services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ${PROJECT_NAME}-mediamtx
    ports:
      - ${SRT_PORT}:8890/udp
      - ${WEBRTC_PORT}:8889
      # ICE 1:1 (UDP i TCP): MediaMTX oglasza klientom port, na ktorym nasluchuje
      - ${STREAM_PORT}:${STREAM_PORT}/udp
      - ${STREAM_PORT}:${STREAM_PORT}/tcp
      # RTMP od drona DJI (z internetu, z haslem); port trzeba tez otworzyc w firewallu serwera
      - ${RTMP_PORT:-1935}:1935
      # RTSP (diagnostyka, tylko TCP); nasluch wlacza RTSP_ENABLE=yes, bez tego polaczenia sa odrzucane
      - ${RTSP_PORT:-18554}:8554
    environment:
      - MTX_WEBRTCLOCALUDPADDRESS=:${STREAM_PORT}
      - MTX_WEBRTCLOCALTCPADDRESS=:${STREAM_PORT}
      # publiczny adres (IP lub nazwa) serwera dla kandydatow ICE; lista po przecinku
      - MTX_WEBRTCADDITIONALHOSTS=${WEBRTC_ADDITIONAL_HOSTS}
      # login i haslo nadawcy drona (wpis nr 2 w authInternalUsers w server/mediamtx.yml); oba wymagane
      - MTX_AUTHINTERNALUSERS_2_USER=${DJI_PUBLISH_USER:?set DJI_PUBLISH_USER in .env}
      - MTX_AUTHINTERNALUSERS_2_PASS=${DJI_PUBLISH_PASS:?set DJI_PUBLISH_PASS in .env}
      # wyjscie RTSP (yes/no)
      - MTX_RTSP=${RTSP_ENABLE:-no}
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml
    restart: always
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ${PROJECT_NAME}-mqtt
    ports:
      - ${MQTT_PORT}:1883
    volumes:
      - ./server/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: always
  backend:
    build: ./backend
    container_name: ${PROJECT_NAME}-backend
    environment:
      - APP_ENV=${APP_ENV}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_V2_TOKEN}
      - INFLUXDB_ORG=KoNaR
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      # adres rosbridge robota (VPN); bez tego backend probuje localhost i /api/v1/ros/* zostaje na false
      - ROSBRIDGE_HOST=${ROSBRIDGE_HOST}
    depends_on:
      - influxdb
    restart: always
  gateway:
    build: ./gateway
    container_name: ${PROJECT_NAME}-gateway
    environment:
      - API_KEY=${GATEWAY_API_KEY}
      - ROSBRIDGE_HOST=${ROSBRIDGE_HOST:-10.13.13.2}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      # baza adresow WHEP w /streams; pusta = sciezki wzgledne (/video/<cam>/whep) na tym samym hoscie co API
      - MEDIAMTX_BASE=${MEDIAMTX_BASE:-}
      - STREAMS_VPN_ONLY=${STREAMS_VPN_ONLY:-1}
    depends_on:
      - mosquitto
    restart: always
  frontend:
    build: ./frontend
    container_name: ${PROJECT_NAME}-frontend
    volumes:
      - frontend-dist:/app/dist
    command: ["sh", "-c", "npm run build"]
    restart: no
  influxdb:
    image: influxdb:2
    container_name: ${PROJECT_NAME}-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=KoNaR
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_V2_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./server/influxdb/config:/etc/influxdb2
    restart: always
volumes:
  frontend-dist:
    name: ${PROJECT_NAME}_frontend-dist
  mosquitto-data: null
  mosquitto-log: null
  influxdb-data: null
  prometheus-data: null
  grafana-data: null
networks:
  default:
    name: ${INTERNAL_NETWORK_NAME:-cerber_internal}
    external: true
